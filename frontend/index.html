<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vite-ui-theme');
          var isDark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.background = '#121213';
          } else {
            document.documentElement.style.background = '#fffdf8';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Definitely Not Wordle</title>
    <meta name="description" content="A daily 5-letter word puzzle. Guess the word in 6 tries. Not that one. This one." />
    <meta property="og:title" content="Definitely Not Wordle" />
    <meta property="og:description" content="A daily 5-letter word puzzle. Not that one. This one." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Definitely Not Wordle" />
    <meta name="twitter:description" content="A daily 5-letter word puzzle. Not that one. This one." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
